# Builds and tests the package on every PR and on main. Devin Review reads the diff; this runs
# the offline tests (the live ones need a key and stay local). Public repo: runner minutes are
# free.
#
# The manifest is swift-tools-version 6.4, which ships with Xcode 27. `macos-26` tops out at
# Xcode 26.6, so the job runs on GitHub's separate `xcode-27` image (generally available
# 2026-10-15; default Xcode 27.0, 27A266a) on the image's own toolchain, as SimKDSKit does.
# A swift.org toolchain through swift-actions/setup-swift was tried first and failed at setup
# (TechDebt TD-5, #7).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
